name: Deploy Physio MCP Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: physio-mcp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: Validate production auth secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PHYSIO_ALLOWED_GOOGLE_EMAILS: ${{ secrets.PHYSIO_ALLOWED_GOOGLE_EMAILS }}
        run: |
          set -euo pipefail
          node scripts/assert-production-deploy-secrets.mjs
          echo "::add-mask::${GOOGLE_CLIENT_ID}"
          echo "::add-mask::${GOOGLE_CLIENT_SECRET}"
          echo "::add-mask::${BETTER_AUTH_SECRET}"
          echo "::add-mask::${PHYSIO_ALLOWED_GOOGLE_EMAILS}"
      - name: Prepare Wrangler config (production D1 ID)
        env:
          PHYSIO_D1_DATABASE_ID: ${{ secrets.PHYSIO_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PHYSIO_D1_DATABASE_ID}"
          node scripts/prepare-wrangler-config.mjs --output wrangler.ci.jsonc
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply PHYSIO_DB --remote --config wrangler.ci.jsonc
      - name: Put production Worker auth secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PHYSIO_ALLOWED_GOOGLE_EMAILS: ${{ secrets.PHYSIO_ALLOWED_GOOGLE_EMAILS }}
        run: |
          set -euo pipefail
          node scripts/assert-production-deploy-secrets.mjs
          echo "::add-mask::${GOOGLE_CLIENT_ID}"
          echo "::add-mask::${GOOGLE_CLIENT_SECRET}"
          echo "::add-mask::${BETTER_AUTH_SECRET}"
          echo "::add-mask::${PHYSIO_ALLOWED_GOOGLE_EMAILS}"
          node scripts/put-production-worker-secrets.mjs --config wrangler.ci.jsonc
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: deploy --config wrangler.ci.jsonc
