<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Public link print failed media fixture</title>
    <link rel="stylesheet" href="/src/ui/styles/public-link-page.css" />
  </head>
  <body>
    <ul class="link-page-list">
      <li class="link-page-row">
        <h2 class="link-page-row-title">Heel slide, stretch</h2>
        <p class="link-page-row-description link-page-row-description--grid">
          Gentle knee flexion stretch for patients.
        </p>
        <div class="link-page-carousel link-page-no-print" aria-hidden="true">
          Carousel placeholder
        </div>
        <div class="link-page-media-failed" data-testid="public-link-media-failed">
          <p class="link-page-print-media-failed">Images didn't load.</p>
        </div>
        <dl class="link-page-positions link-page-positions--grid">
          <div class="link-page-positions-pair">
            <dt>Starting position</dt>
            <dd>Supine.</dd>
          </div>
        </dl>
        <div class="link-page-dose">
          <p class="link-page-dose-line">30s hold</p>
        </div>
      </li>
    </ul>
  </body>
</html>
