<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Public link print wide fixture</title>
    <link rel="stylesheet" href="/src/ui/styles/public-link-page.css" />
    <style>
      body {
        margin: 0;
        padding: 0.75rem;
      }
    </style>
  </head>
  <body>
    <ul class="link-page-list">
      <li class="link-page-row">
        <h2 class="link-page-row-title">Heel slide, stretch</h2>
        <p class="link-page-row-description link-page-row-description--grid">
          Gentle knee flexion stretch for patients.
        </p>
        <div class="link-page-carousel link-page-no-print" aria-hidden="true">
          Carousel placeholder
        </div>
        <div class="link-page-only-print">
          <figure class="link-page-print-still link-page-print-still--start">
            <img class="link-page-print-still-img" src="#" alt="" />
            <figcaption class="link-page-print-caption">Start</figcaption>
          </figure>
          <figure class="link-page-print-still link-page-print-still--end">
            <img class="link-page-print-still-img" src="#" alt="" />
            <figcaption class="link-page-print-caption">End</figcaption>
          </figure>
        </div>
        <dl class="link-page-positions link-page-positions--grid">
          <div class="link-page-positions-pair">
            <dt>
              <span
                class="link-page-positions-marker link-page-positions-marker--start"
                aria-hidden="true"
              ></span>
              Starting position
            </dt>
            <dd>Supine with knee bent.</dd>
          </div>
          <div class="link-page-positions-pair">
            <dt>
              <span
                class="link-page-positions-marker link-page-positions-marker--end"
                aria-hidden="true"
              ></span>
              Ending position
            </dt>
            <dd>Knee extended flat.</dd>
          </div>
        </dl>
        <div class="link-page-dose">
          <p class="link-page-dose-line">
            <span class="link-page-dose-strong">30s</span> hold
          </p>
        </div>
        <p class="link-page-row-note">Slow and controlled.</p>
      </li>
    </ul>
  </body>
</html>
