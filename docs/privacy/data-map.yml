schema_version: 1

d1_tables:
  schema_migrations:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: indefinite
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      id: {}
      applied_at: {}

  practitioners:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      id:
        whose: practitioner
        data: Opaque practitioner id
        purpose: identify practitioner account and link activity rows
        processors: [Cloudflare]
        retention: until account deletion
      email:
        whose: practitioner
        data: Practitioner sign-in email
        purpose: authentication
        processors: [Cloudflare]
        retention: until account deletion
      created_at:
        whose: practitioner
        data: Account creation timestamp
        purpose: audit
        processors: [Cloudflare]
        retention: until account deletion

  exercises:
