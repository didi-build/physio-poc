      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      exercise_id: {}
      body_region_id: {}

  exercise_requests:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until request closed
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      id:
        whose: operational
      requested_name:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      note:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      requested_by:
        whose: practitioner
        data: Practitioner id of requester
        purpose: shared requests and drafts list
        processors: [Cloudflare]
        retention: until request closed
      status:
        whose: operational
      exercise_id:
        whose: operational
      created_at:
        whose: operational
      updated_at:
        whose: operational

  type_defaults:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until practitioner or global row deleted
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
      notes: Global rows are visible to every practitioner; practitioner scope rows are owner-only (see practitioner_id).
    columns:
      id:
        whose: operational
      scope:
        whose: operational
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My defaults override row
        purpose: per-practitioner type defaults
        processors: [Cloudflare]
        retention: until row deleted or reset to global
        who_can_see: owner_only
      type:
        whose: operational
      params_json:
        whose: operational

  practitioner_exercises:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My exercises row
        purpose: favourites and overrides
        processors: [Cloudflare]
        retention: until row deleted
      exercise_id:
        whose: practitioner
        data: Linked library exercise id
        purpose: My exercises membership
        processors: [Cloudflare]
        retention: until row deleted
      favourite:
        whose: practitioner
        data: Pinned or favourite flag
        purpose: My exercises ordering
        processors: [Cloudflare]
        retention: until row deleted
      saved_at:
        whose: practitioner
        data: Saved timestamp
        purpose: My exercises activity
        processors: [Cloudflare]
        retention: until row deleted
      last_used_at:
        whose: practitioner
        data: Last used timestamp
        purpose: My exercises activity
        processors: [Cloudflare]
        retention: until row deleted
      text_overrides_json:
        whose: practitioner
        data: Validated partial text overrides JSON
        purpose: My copy edits
        processors: [Cloudflare]
        retention: until row deleted
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      param_overrides_json:
        whose: practitioner
        data: Validated param overrides JSON by type
        purpose: My copy dose overrides
        processors: [Cloudflare]
        retention: until row deleted

  exercise_media_sets:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: until exercise version deleted
      who_can_see: all_practitioners when public; draft author and reviewers only via app
      source: migrations/0003_exercise_media.sql
      verified: true
    columns:
      id: {}
      start_object_key:
        notes: R2 object key; no patient information in key path
      end_object_key:
        notes: R2 object key; no patient information in key path
      start_provider_url:
        notes: fal CDN URL for the start image when returned by the provider; used to chain end-image edit
      visibility:
        notes: draft until exercise version approved; public when live
      created_at: {}

  media_regenerations:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: indefinite
      who_can_see: server-side only
      source: migrations/0003_exercise_media.sql
      verified: true
    columns:
      id: {}
      practitioner_id: {}
      exercise_id: {}
      exercise_version_id: {}
      scope: {}
      had_note:
        notes: audit flag only; regeneration note text is never stored
      created_at: {}

