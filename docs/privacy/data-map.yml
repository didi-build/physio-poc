        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      cue_eccentric:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      media_set_id:
        whose: operational
      change_summary:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      created_at:
        whose: operational

  exercise_aliases:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: until exercise deleted
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      id: {}
      exercise_id: {}
      alias:
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      created_at: {}

  body_regions:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: indefinite
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
