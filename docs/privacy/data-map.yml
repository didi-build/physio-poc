        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      starting_position:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      steps:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      common_mistakes:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
