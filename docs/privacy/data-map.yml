  exercise_body_regions:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: until exercise deleted
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      exercise_id: {}
      body_region_id: {}

  exercise_requests:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until request closed
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      id:
        whose: operational
      requested_name:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      note:
        whose: operational
        notes: patient_detail_risk; validateFreeTextForPatientDetails on write
      requested_by:
        whose: practitioner
        data: Practitioner id of requester
        purpose: shared requests and drafts list
        processors: [Cloudflare]
        retention: until request closed
      status:
        whose: operational
      exercise_id:
        whose: operational
      created_at:
        whose: operational
      updated_at:
        whose: operational

  type_defaults:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until practitioner or global row deleted
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
      notes: Global rows are visible to every practitioner; practitioner scope rows are owner-only (see practitioner_id).
    columns:
      id:
        whose: operational
      scope:
        whose: operational
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My defaults override row
        purpose: per-practitioner type defaults
        processors: [Cloudflare]
        retention: until row deleted or reset to global
        who_can_see: owner_only
      type:
        whose: operational
      params_json:
        whose: operational

  practitioner_exercises:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My exercises row
        purpose: favourites and overrides
        processors: [Cloudflare]
        retention: until row deleted
      exercise_id:
        whose: practitioner
        data: Linked library exercise id
        purpose: My exercises membership
        processors: [Cloudflare]
        retention: until row deleted
      favourite:
        whose: practitioner
        data: Pinned or favourite flag
        purpose: My exercises ordering
        processors: [Cloudflare]
        retention: until row deleted
      saved_at:
        whose: practitioner
        data: Saved timestamp
        purpose: My exercises activity
        processors: [Cloudflare]
        retention: until row deleted
      last_used_at:
        whose: practitioner
        data: Last used timestamp
        purpose: My exercises activity
        processors: [Cloudflare]
        retention: until row deleted
      text_overrides_json:
        whose: practitioner
        data: Partial text overrides JSON keyed by title, description, or cue fields; each set field is an object with string value (practitioner edit) and string base (library text when the override was saved)
        purpose: My copy edits
        processors: [Cloudflare]
        retention: until row deleted
        notes: patient_detail_risk; length caps and patient-detail validation apply to value on write; base is stored as a string snapshot only
      param_overrides_json:
        whose: practitioner
        data: Validated param overrides JSON by type
        purpose: My copy dose overrides
        processors: [Cloudflare]
        retention: until row deleted

  programs:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until purged after 30 days in Recently deleted
      who_can_see: owner_only
      source: migrations/0002_program_data_model.sql
      verified: true
      notes: Practitioner-chosen program name plus code only; no patient details.
    columns:
      id:
        whose: operational
      code:
        whose: operational
        notes: PRG- prefixed lookup code; no patient details
      name:
        whose: operational
        notes: validateOptionalProgramName on create or rename; validateProgramName on publish
      created_by:
        whose: practitioner
        data: Practitioner id of program owner
        purpose: programs list ownership
        processors: [Cloudflare]
        retention: until program purged
      created_at:
        whose: operational
      draft_version:
        whose: operational
      draft_updated_at:
        whose: operational
      published_version:
        whose: operational
      published_name:
        whose: operational
        notes: patient_detail_risk; frozen at publish for the share link
      published_at:
        whose: operational
      published_snapshot_json:
        whose: operational
        notes: Frozen published rows JSON; link serves this until republish
      deleted_at:
        whose: operational
      link_expires_in:
        whose: operational
      link_expires_on:
        whose: operational

  program_rows:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until program purged
      who_can_see: owner_only
      source: migrations/0002_program_data_model.sql
      verified: true
    columns:
      id:
        whose: operational
      program_id:
        whose: operational
      position:
        whose: operational
      exercise_id:
        whose: operational
      exercise_version_id:
        whose: operational
      exercise_request_id:
        whose: operational
      prescription_type:
        whose: operational
      params_json:
        whose: operational
      text_snapshot_json:
        whose: operational
        notes: validateProgramRowTextSnapshot on write (title, description, cue)
      note:
        whose: operational
        notes: patient_detail_risk; validateProgramRowNote on write

  share_links:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until program purged
      who_can_see: operational
      source: migrations/0002_program_data_model.sql
      verified: true
      notes: Opaque token only; no patient information in URL beyond token.
    columns:
      id:
        whose: operational
      program_id:
        whose: operational
      token:
        whose: operational
        notes: CSPRNG opaque token; unguessable
      expires_at:
        whose: operational
        notes: null means never expires until closed
      closed_at:
        whose: operational
      created_at:
        whose: operational

  share_link_defaults:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until row deleted
      who_can_see: all_practitioners
      source: migrations/0002_program_data_model.sql
      verified: true
      notes: Global default is 1 year; practitioner scope overrides My defaults expiry.
    columns:
      id:
        whose: operational
      scope:
        whose: operational
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My defaults share link expiry
        purpose: default expiry for new share links
        processors: [Cloudflare]
        retention: until row deleted or reset
        who_can_see: owner_only
      expires_in:
        whose: operational
      custom_expires_on:
        whose: operational

  exercise_media_sets:
    defaults:
      whose: operational
      storage: D1
      processors: [Cloudflare]
      retention: until exercise version deleted
      who_can_see: all_practitioners when public; draft author and reviewers only via app
      source: migrations/0003_exercise_media.sql
      verified: true
    columns:
      id: {}
      start_object_key:
        notes: Object storage key (MediaStoragePort wiring in DIDI-1040); no patient information in key path
      end_object_key:
        notes: Object storage key (MediaStoragePort wiring in DIDI-1040); no patient information in key path
      start_provider_url:
        notes: fal CDN URL for the start image when returned by the provider; used to chain end-image edit
      visibility:
        notes: draft until exercise version approved; public when live
      created_at: {}

  media_regenerations:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: indefinite
      who_can_see: server-side only
      source: migrations/0003_exercise_media.sql
      verified: true
    columns:
      id:
        whose: operational
      practitioner_id:
        whose: practitioner
        data: Practitioner id for regeneration audit row
        purpose: daily regeneration cap
        processors: [Cloudflare]
        retention: 30 days after created_at
        notes: Purged by scheduled job in DIDI-1073
      exercise_id:
        whose: operational
      exercise_version_id:
        whose: operational
      scope:
        whose: operational
      had_note:
        whose: operational
        notes: audit flag only; regeneration note text is never stored
      created_at:
        whose: operational

  user:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0004_better_auth.sql
      verified: true
      notes: image URL is not stored (CTO DIDI-1001 minimal auth storage); practitionerId is an internal opaque id, not personal data
    columns:
      id:
        whose: practitioner
        data: Better Auth user id linked to practitioner sign-in
        purpose: authentication
        processors: [Cloudflare]
        retention: until account deletion
      name:
        whose: practitioner
        data: Display name from Google profile
        purpose: account profile
        processors: [Cloudflare]
        retention: until account deletion
      email:
        whose: practitioner
        data: Practitioner sign-in email
        purpose: authentication
        processors: [Cloudflare]
        retention: until account deletion
      emailVerified:
        whose: operational
      createdAt:
        whose: operational
      updatedAt:
        whose: operational
      image:
        whose: operational
        notes: column required by Better Auth; always null (not stored)
      practitionerId:
        whose: operational
        data: Internal opaque practitioners.id bound at session creation for authorization
        purpose: session-to-practitioner binding (not sign-in email)
        processors: [Cloudflare]
        retention: until account deletion or binding cleared
        notes: Same id type as practitioners.id elsewhere; not patient or practitioner contact data

  session:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0004_better_auth.sql
      verified: true
      notes: ipAddress and userAgent are not stored (CTO DIDI-1001 minimal auth storage)
    columns:
      id:
        whose: operational
      expiresAt:
        whose: operational
      token:
        whose: practitioner
        data: Session token
        purpose: authentication
        processors: [Cloudflare]
        retention: until session expiry or sign-out
      createdAt:
        whose: operational
      updatedAt:
        whose: operational
      userId:
        whose: practitioner
        data: Linked Better Auth user id
        purpose: authentication
        processors: [Cloudflare]
        retention: until session expiry or sign-out
      ipAddress:
        whose: operational
        notes: column required by Better Auth; always null (not stored)
      userAgent:
        whose: operational
        notes: column required by Better Auth; always null (not stored)

  account:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0004_better_auth.sql
      verified: true
    columns:
      id:
        whose: operational
      accountId:
        whose: operational
      providerId:
        whose: operational
      userId:
        whose: practitioner
        data: Linked Better Auth user id
        purpose: authentication
        processors: [Cloudflare]
        retention: until account deletion
      scope:
        whose: operational
        notes: openid email profile only; OAuth tokens are not stored
      accessToken:
        whose: operational
        notes: column required by Better Auth; always null (encryptOAuthTokens enabled as defense in depth)
      refreshToken:
        whose: operational
        notes: column required by Better Auth; always null
      idToken:
        whose: operational
        notes: column required by Better Auth; always null
      accessTokenExpiresAt:
        whose: operational
        notes: always null
      refreshTokenExpiresAt:
        whose: operational
        notes: always null
      password:
        whose: operational
        notes: always null; Google OAuth only
      createdAt:
        whose: operational
      updatedAt:
        whose: operational

  verification:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0004_better_auth.sql
      verified: true
    columns:
      id:
        whose: operational
      identifier:
        whose: operational
      value:
        whose: operational
      expiresAt:
        whose: operational
      createdAt:
        whose: operational
      updatedAt:
        whose: operational

