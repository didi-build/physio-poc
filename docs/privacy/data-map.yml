      source: migrations/0001_exercise_data_model.sql
      verified: true
      notes: Global rows are visible to every practitioner; practitioner scope rows are owner-only (see practitioner_id).
    columns:
      id:
        whose: operational
      scope:
        whose: operational
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My defaults override row
        purpose: per-practitioner type defaults
        processors: [Cloudflare]
        retention: until row deleted or reset to global
        who_can_see: owner_only
      type:
        whose: operational
      params_json:
        whose: operational

  practitioner_exercises:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: owner_only
      source: migrations/0001_exercise_data_model.sql
      verified: true
    columns:
      practitioner_id:
        whose: practitioner
        data: Practitioner id for My exercises row
        purpose: favourites and overrides
        processors: [Cloudflare]
        retention: until row deleted
      exercise_id:
        whose: practitioner
        data: Linked library exercise id
        purpose: My exercises membership
        processors: [Cloudflare]
        retention: until row deleted
      favourite:
        whose: practitioner
        data: Pinned or favourite flag
        purpose: My exercises ordering
        processors: [Cloudflare]
        retention: until row deleted
      saved_at:
        whose: practitioner
        data: Saved timestamp
        purpose: My exercises activity
        processors: [Cloudflare]
        retention: until row deleted
      last_used_at:
        whose: practitioner
        data: Last used timestamp
        purpose: My exercises activity
        processors: [Cloudflare]
        retention: until row deleted
      text_overrides_json:
        whose: practitioner
        data: Partial text overrides JSON keyed by title, description, or cue fields; each set field is an object with string value (practitioner edit) and string base (library text when the override was saved)
        purpose: My copy edits
        processors: [Cloudflare]
        retention: until row deleted
        notes: patient_detail_risk; length caps and patient-detail validation apply to value on write; base is stored as a string snapshot only
      param_overrides_json:
        whose: practitioner
        data: Validated param overrides JSON by type
        purpose: My copy dose overrides
        processors: [Cloudflare]
        retention: until row deleted

  programs:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until purged after 30 days in Recently deleted
      who_can_see: owner_only
      source: migrations/0002_program_data_model.sql
      verified: true
      notes: Practitioner-chosen program name plus code only; no patient details.
    columns:
      id:
        whose: operational
      code:
        whose: operational
        notes: PRG- prefixed lookup code; no patient details
      name:
        whose: operational
        notes: validateOptionalProgramName on create or rename; validateProgramName on publish
      created_by:
        whose: practitioner
        data: Practitioner id of program owner
        purpose: programs list ownership
        processors: [Cloudflare]
        retention: until program purged
      created_at:
        whose: operational
      draft_version:
        whose: operational
      draft_updated_at:
        whose: operational
      published_version:
        whose: operational
      published_name:
        whose: operational
        notes: patient_detail_risk; frozen at publish for the share link
      published_at:
        whose: operational
      published_snapshot_json:
        whose: operational
        notes: Frozen published rows JSON; link serves this until republish
      deleted_at:
        whose: operational
      link_expires_in:
        whose: operational
      link_expires_on:
        whose: operational
      source_routine_id:
        whose: operational
        notes: Nullable; set when program was created from a routine
      source_routine_version_id:
        whose: operational
        notes: Pinned community routine version at program creation; later routine edits do not change program
      source_routine_origin:
        whose: operational
        notes: used_as_is or tweaked when from routine; null when built from scratch

  program_rows:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until program purged
      who_can_see: owner_only
      source: migrations/0002_program_data_model.sql
      verified: true
    columns:
      id:
        whose: operational
      program_id:
        whose: operational
      position:
        whose: operational
      exercise_id:
        whose: operational
      exercise_version_id:
        whose: operational
      exercise_request_id:
        whose: operational
      prescription_type:
        whose: operational
      params_json:
        whose: operational
      text_snapshot_json:
        whose: operational
        notes: validateProgramRowTextSnapshot on write (title, description, cue)
      note:
        whose: operational
        notes: patient_detail_risk; validateProgramRowNote on write

  share_links:
    defaults:
      storage: D1
      processors: [Cloudflare]
