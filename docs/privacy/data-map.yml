      verified: true
    columns:
      id:
        whose: operational
      category:
        whose: operational
      created_by:
        whose: practitioner
        data: Practitioner id of exercise author
        purpose: shared library attribution
        processors: [Cloudflare]
        retention: until exercise deleted
      created_at:
        whose: operational

  exercise_versions:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until exercise deleted
      who_can_see: all_practitioners
      source: migrations/0001_exercise_data_model.sql
      verified: true
