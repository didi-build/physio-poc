        whose: operational
      draft_updated_at:
        whose: operational

  routine_versions:
    defaults:
      storage: D1
      processors: [Cloudflare]
      retention: until routine deleted
      who_can_see: all_practitioners
      source: migrations/0005_routine_data_model.sql
